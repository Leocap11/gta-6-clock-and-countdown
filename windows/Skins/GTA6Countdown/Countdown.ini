[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1
LocalFont=#@#Fonts\Pricedown Bl.otf
OnRefreshAction=[!ZPos -2][!Draggable 0][!CommandMeasure MeasureCountdown "PlaceOnFirstRun()"]
LeftMouseDoubleClickAction=[!CommandMeasure MeasureCountdown "ToggleLock()"]
MouseLeaveAction=[!CommandMeasure MeasureCountdown "Lock()"]

[Metadata]
Name=GTA VI Countdown
Information=GTA VI release countdown. Double-click to unlock it and drag it around.

[Variables]
Positioned=0
HorizontalPosition=0.1235
VerticalPosition=0.486
Scale=(#SCREENAREAHEIGHT#/1440)
ColumnWidth=(168*#Scale#)
TextColor=255,255,255,255
OutlineColor=29,2,49,255
DigitsOutlineWidth=4
CaptionOutlineWidth=2
DateOutlineWidth=2
Days=--
Hours=--
Minutes=--
Seconds=--
ClockTime=
ClockDate=

[MeasureCountdown]
Measure=Script
ScriptFile=#@#Countdown.lua

[TextStyle]
FontFace=Pricedown
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[DigitsStyle]
FontSize=(90*#Scale#)
StringAlign=CenterTop
Y=0
InlineSetting=Stroke | #DigitsOutlineWidth# | #OutlineColor#

[CaptionStyle]
FontSize=(13*#Scale#)
StringAlign=CenterTop
Y=(150*#Scale#)
InlineSetting=Stroke | #CaptionOutlineWidth# | #OutlineColor#

[MeterUnlockedFrame]
Meter=Shape
Shape=Rectangle 0,0,(4*#ColumnWidth#),(185*#Scale#),(12*#Scale#) | Fill Color 20,8,40,90 | StrokeWidth 2 | Stroke Color 255,255,255,180
DynamicVariables=1
Hidden=1

[MeterDays]
Meter=String
MeterStyle=TextStyle | DigitsStyle
Text=#Days#
X=(#ColumnWidth#*0.5)
Group=Countdown

[MeterDaysCaption]
Meter=String
MeterStyle=TextStyle | CaptionStyle
Text=DAYS
X=(#ColumnWidth#*0.5)
Group=Countdown

[MeterHours]
Meter=String
MeterStyle=TextStyle | DigitsStyle
Text=#Hours#
X=(#ColumnWidth#*1.5)
Group=Countdown

[MeterHoursCaption]
Meter=String
MeterStyle=TextStyle | CaptionStyle
Text=HOURS
X=(#ColumnWidth#*1.5)
Group=Countdown

[MeterMinutes]
Meter=String
MeterStyle=TextStyle | DigitsStyle
Text=#Minutes#
X=(#ColumnWidth#*2.5)
Group=Countdown

[MeterMinutesCaption]
Meter=String
MeterStyle=TextStyle | CaptionStyle
Text=MINUTES
X=(#ColumnWidth#*2.5)
Group=Countdown

[MeterSeconds]
Meter=String
MeterStyle=TextStyle | DigitsStyle
Text=#Seconds#
X=(#ColumnWidth#*3.5)
Group=Countdown

[MeterSecondsCaption]
Meter=String
MeterStyle=TextStyle | CaptionStyle
Text=SECONDS
X=(#ColumnWidth#*3.5)
Group=Countdown

[MeterClockTime]
Meter=String
MeterStyle=TextStyle
FontSize=(90*#Scale#)
Text=#ClockTime#
X=(10*#Scale#)
Y=0
InlineSetting=Stroke | #DigitsOutlineWidth# | #OutlineColor#
Group=Clock
Hidden=1

[MeterClockDate]
Meter=String
MeterStyle=TextStyle
FontSize=(27*#Scale#)
Text=#ClockDate#
X=(10*#Scale#)
Y=(150*#Scale#)
InlineSetting=Stroke | #DateOutlineWidth# | #OutlineColor#
Group=Clock
Hidden=1
